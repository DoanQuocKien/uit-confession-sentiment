<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UIT Confession Viewer</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1b1d21;--mut:#6b7280;--bd:#e3e5ea;--pos:#1f8a4c;--neg:#c93a3a;--neu:#6b7280;--accent:#2f6fed}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14161a;--card:#1d2026;--fg:#e8e9ec;--mut:#9aa1ad;--bd:#2c3038;--pos:#4cc27d;--neg:#ee6a6a;--neu:#9aa1ad;--accent:#6c9bff}}
:root[data-theme=dark]{--bg:#14161a;--card:#1d2026;--fg:#e8e9ec;--mut:#9aa1ad;--bd:#2c3038;--pos:#4cc27d;--neg:#ee6a6a;--neu:#9aa1ad;--accent:#6c9bff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:920px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit}
.chip b{font-weight:600}.chip.on{outline:2px solid var(--accent)}
.chip.positive b{color:var(--pos)}.chip.negative b{color:var(--neg)}.chip.neutral b{color:var(--neu)}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-bottom:14px;background:var(--bd)}
.bar i{display:block;height:100%}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2}
input[type=search],select{padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
input[type=search]{flex:1;min-width:180px}
label{color:var(--mut);display:flex;align-items:center;gap:5px;font-size:14px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:13px}
.id{font-weight:600}
.pill{padding:2px 9px;border-radius:999px;color:#fff;font-size:12.5px;font-weight:600}
.pill.positive{background:var(--pos)}.pill.negative{background:var(--neg)}.pill.neutral{background:var(--neu)}.pill.error{background:#b26a00}
.small{color:var(--mut)}
.tag{border:1px solid var(--bd);border-radius:6px;padding:0 6px;color:var(--mut);font-size:12px}
.text{white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.card.open .text{-webkit-line-clamp:unset;overflow:visible}
.why{margin-top:6px;color:var(--mut);font-style:italic;font-size:14px}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin:16px 0}
.pager button{padding:6px 14px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer;font:inherit}
.pager button:disabled{opacity:.4;cursor:default}
.empty{text-align:center;color:var(--mut);padding:40px}
mark{background:#ffe38a;color:#000;border-radius:3px}
</style>
</head>
<body>
<main>
  <h1>UIT Confession: posts and classifications</h1>
  <div class="stats" id="stats"></div>
  <div class="bar" id="bar"></div>
  <div class="ctl">
    <input type="search" id="q" placeholder="Search text or #id">
    <select id="sort"><option value="asc">ID ascending</option><option value="desc">ID descending</option></select>
    <label><input type="checkbox" id="dis"> PhoBERT disagrees</label>
    <label><input type="checkbox" id="shared"> shared ids</label>
    <span class="small" id="count"></span>
  </div>
  <div id="list"></div>
  <div class="pager"><button id="prev">&larr; Prev</button><span id="pg" class="small"></span><button id="next">Next &rarr;</button></div>
</main>
<script>
const PER = 25;
let ROWS = [], view = [], page = 0, label = "";
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

// accent-insensitive: "thang may" finds "thang máy" (and đ matches d)
const fold = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();

function hl(text, q) {                       // escape first, then wrap the search term
  const t = esc(text);
  if (!q) return t;
  const e = esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return t.replace(new RegExp(e, "gi"), m => "<mark>" + m + "</mark>");
}

function stats() {
  const n = {positive: 0, neutral: 0, negative: 0};
  ROWS.forEach(r => { if (n[r.llm_label] !== undefined) n[r.llm_label]++; });
  const tot = ROWS.length || 1;
  $("stats").innerHTML = `<button class="chip ${label ? "" : "on"}" data-l=""><b>${ROWS.length}</b> posts</button>` +
    ["positive", "neutral", "negative"].map(l => `<button class="chip ${l} ${label === l ? "on" : ""}" data-l="${l}"><b>${n[l]}</b> ${l} <span class="small">${(100 * n[l] / tot).toFixed(0)}%</span></button>`).join("");
  const col = {positive: "var(--pos)", neutral: "var(--neu)", negative: "var(--neg)"};
  $("bar").innerHTML = ["positive", "neutral", "negative"].map(l => `<i style="width:${100 * n[l] / tot}%;background:${col[l]}"></i>`).join("");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { label = b.dataset.l === label ? "" : b.dataset.l; page = 0; stats(); draw(); });
}

function draw() {
  const q = fold($("q").value.trim().replace(/^#/, ""));
  view = ROWS.filter(r => (!label || r.llm_label === label) && (!$("dis").checked || !r.agree) && (!$("shared").checked || r.shared > 1)
    && (!q || (r._f ??= fold(r.text + " " + r.llm_reason)).includes(q) || r.confession_id === q));
  const dir = $("sort").value === "asc" ? 1 : -1;
  view.sort((a, b) => dir * ((+a.confession_id) - (+b.confession_id)));
  const pages = Math.max(1, Math.ceil(view.length / PER));
  page = Math.min(page, pages - 1);
  $("count").textContent = view.length + " shown";
  $("pg").textContent = `page ${page + 1} / ${pages}`;
  $("prev").disabled = page === 0; $("next").disabled = page >= pages - 1;
  const raw = $("q").value.trim().replace(/^#/, "");
  $("list").innerHTML = view.length ? view.slice(page * PER, (page + 1) * PER).map(r => `
    <div class="card">
      <div class="head">
        <span class="id">#${esc(r.confession_id)}</span>
        <span class="pill ${r.llm_label}" title="LLM (Qwen2.5-7B)">${r.llm_label}</span>
        <span class="small" title="PhoBERT second opinion">PhoBERT: ${r.phobert_label}${r.agree ? "" : " &ne;"}</span>
        ${r.shared > 1 ? `<span class="tag" title="Several different posts use this number">id shared by ${r.shared}</span>` : ""}
        ${r.truncated ? `<span class="tag">truncated</span>` : ""}
      </div>
      <div class="text" onclick="this.parentElement.classList.toggle('open')">${hl(r.text, raw)}</div>
      <div class="why">${esc(r.llm_reason)}</div>
    </div>`).join("") : `<div class="empty">No posts match.</div>`;
  window.scrollTo({top: 0});
}

$("prev").onclick = () => { page--; draw(); };
$("next").onclick = () => { page++; draw(); };
["input", "change"].forEach(ev => ["q", "sort", "dis", "shared"].forEach(id => $(id).addEventListener(ev, () => { page = 0; draw(); })));

fetch("/api/data").then(r => r.json()).then(d => { ROWS = d; stats(); draw(); })
  .catch(() => { $("list").innerHTML = '<div class="empty">Could not load /api/data. Is ui.py running?</div>'; });
</script>
</body>
</html>
